aid: alleviant-medical
name: Alleviant Medical
description: 'Alleviant Medical, Inc. is a clinical-stage medical device company headquartered
  in Austin, Texas, founded in 2017 to develop minimally invasive, transcatheter therapies
  for heart failure. The Alleviant System is an investigational, no-implant approach that
  creates a small interatrial passageway to relieve elevated left atrial pressure without
  leaving a permanent device behind; it holds U.S. FDA Breakthrough Device designation for
  both preserved and reduced ejection fraction heart failure and is under study in the
  FDA-approved ALLAY-HF and ALLAY-HFrEF pivotal trials. The company has raised roughly $164M
  across a $75M round led by S3 Ventures and RiverVest Venture Partners and a $90M round led
  by Gilde Healthcare with Omega Funds, Vensana Capital, Longview Ventures, Gilmartin Capital
  and the TMC Venture Fund. Alleviant is a device and clinical-trial business, not a software
  business: it publishes no developer portal, no public API, no SDK and no machine-readable
  specification, and its public web surface is limited to clinician, patient-education,
  investor and press material.'
